<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Trail — Phase 0 marker dropper</title>

<!-- Throwaway. No auth, no validation, no design. Its only job is to prove that
     a click in a browser becomes a row in Postgres that the phone can read.
     Dies when Phase 2's real editor exists. -->

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; }
  #map { flex: 1; }
  #side {
    width: 340px; padding: 16px; overflow-y: auto;
    border-left: 1px solid #8884; display: flex; flex-direction: column; gap: 10px;
  }
  h1 { font-size: 15px; margin: 0; }
  p.hint { font-size: 12px; opacity: .7; margin: 0; line-height: 1.5; }
  label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 3px; }
  input, textarea, select {
    width: 100%; padding: 7px; font: inherit; font-size: 13px;
    border: 1px solid #8886; border-radius: 5px; background: transparent; color: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  button {
    padding: 9px; font: inherit; font-weight: 600; border: 0; border-radius: 5px;
    background: #C2483A; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  #log { font-size: 12px; white-space: pre-wrap; line-height: 1.5; min-height: 40px; }
  .ok { color: #2e7d32; } .err { color: #c62828; }
  .coord { font-family: ui-monospace, monospace; font-size: 12px; opacity: .8; }
  .row { display: flex; gap: 8px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="side">
  <h1>Phase 0 — marker dropper</h1>
  <p class="hint">Click the map to set a position, fill in the text, press Save.
    Saved markers reload from <code>markers_near</code> — the same function the
    phone calls.</p>

  <div>
    <label>Position</label>
    <div class="coord" id="coord">— click the map —</div>
  </div>

  <div><label for="title">Title</label><input id="title" placeholder="Bezisten"></div>
  <div><label for="body">Body</label><textarea id="body" placeholder="What the reader sees."></textarea></div>

  <div class="row">
    <div style="flex:1"><label for="lang">Language</label>
      <select id="lang"><option value="bg">bg</option><option value="en">en</option></select>
    </div>
    <div style="flex:1"><label for="colour">Colour</label><input id="colour" type="color" value="#C2483A"></div>
  </div>

  <button id="save" disabled>Save marker</button>
  <div id="log"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.local.js"></script>
<script>
(function () {
  const log = (msg, cls) => {
    const el = document.getElementById("log");
    el.textContent = msg;
    el.className = cls || "";
  };

  const cfg = window.AR_TRAIL_CONFIG;
  if (!cfg || cfg.SUPABASE_URL.includes("YOUR-PROJECT-REF")) {
    log("No config. Copy config.example.js to config.local.js and fill it in.", "err");
    return;
  }

  const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  let picked = null;

  // OSM raster tiles: no API key, no token, fine for development volumes.
  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize: 256,
          attribution: "&copy; OpenStreetMap contributors"
        }
      },
      layers: [{ id: "osm", type: "raster", source: "osm" }]
    },
    center: [cfg.START_LNG, cfg.START_LAT],  // MapLibre is [lng, lat] — like PostGIS
    zoom: cfg.START_ZOOM
  });

  let pin = null;
  map.on("click", (e) => {
    // e.lngLat is {lng, lat}. Keep the names attached to the values everywhere;
    // the whole class of coordinate bugs comes from bare positional pairs.
    picked = { lat: e.lngLat.lat, lng: e.lngLat.lng };
    document.getElementById("coord").textContent =
      picked.lat.toFixed(6) + ", " + picked.lng.toFixed(6) + "  (lat, lng)";
    document.getElementById("save").disabled = false;
    if (pin) pin.remove();
    pin = new maplibregl.Marker({ color: document.getElementById("colour").value })
      .setLngLat([picked.lng, picked.lat]).addTo(map);
  });

  document.getElementById("save").addEventListener("click", async () => {
    if (!picked) return;
    const title = document.getElementById("title").value.trim();
    if (!title) { log("Give it a title.", "err"); return; }

    const lang = document.getElementById("lang").value;
    const content = {};
    content[lang] = { title: title, body: document.getElementById("body").value.trim() };

    document.getElementById("save").disabled = true;
    log("Saving…");

    // PostGIS wants WKT as "POINT(lng lat)". Longitude first. Always.
    const { error } = await db.from("markers").insert({
      world_id: cfg.WORLD_ID,
      location: "SRID=4326;POINT(" + picked.lng + " " + picked.lat + ")",
      style_key: "default",
      colour_hex: document.getElementById("colour").value.toUpperCase(),
      content: content,
      status: "published"    // Phase 0 publishes immediately; there is no editor yet.
    });

    if (error) { log("Failed: " + error.message, "err"); }
    else {
      log("Saved. Walk to it.", "ok");
      document.getElementById("title").value = "";
      document.getElementById("body").value = "";
      loadExisting();
    }
    document.getElementById("save").disabled = false;
  });

  // Read back through the RPC, not the table — the same seam the phone uses (§4).
  const shown = [];
  async function loadExisting() {
    const { data, error } = await db.rpc("markers_near", {
      p_world_id: cfg.WORLD_ID,
      p_lat: cfg.START_LAT,
      p_lng: cfg.START_LNG,
      p_radius_m: 5000
    });
    if (error) { log("Load failed: " + error.message, "err"); return; }

    while (shown.length) shown.pop().remove();
    (data || []).forEach((m) => {
      const el = new maplibregl.Marker({ color: m.colour_hex || "#666" })
        .setLngLat([m.lng, m.lat])
        .setPopup(new maplibregl.Popup().setText(
          (Object.values(m.content || {})[0] || {}).title || "(untitled)"))
        .addTo(map);
      shown.push(el);
    });
    log("Loaded " + (data || []).length + " marker(s) through markers_near.", "ok");
  }

  map.on("load", loadExisting);
})();
</script>
</body>
</html>
