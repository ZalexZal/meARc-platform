# Building the site on push, instead of dragging a folder.
#
# Every deploy so far has been a manual upload of web/dist, which is why the
# live site spent two days serving [име на отговорника] and telling new accounts
# to open a confirmation link that was never sent: the fixes existed, built, and
# sat on one laptop.
#
# Point Netlify at this repository once - Site configuration, Build & deploy,
# link to ZalexZal/noit-platform - and this file does the rest. The two
# PUBLIC_ variables go in the Netlify UI under Environment variables; they are
# baked into the JavaScript at build time and are both public by design. The
# service_role key is not one of them and never goes here.
#
# node_modules in web/ is unreadable on the laptop this was written on, which is
# why rebuild.ps1 exists. Netlify installs into a clean container, so npm ci
# works there normally and rebuild.ps1 stays a local workaround.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The floor is not a preference: web/package.json declares
  # engines.node ">=22.12.0" because Astro 7 requires it. This was pinned at 20
  # out of caution and the first deploy died on "Node.js v20.20.2 is not
  # supported by Astro". Raise it here and there together, or leave it alone.
  NODE_VERSION = "22"

# keep-alive.mjs runs once a day so Supabase Free never pauses the project.
# Relative to base, so web/netlify/functions.
[functions]
  directory = "netlify/functions"

# Astro writes a directory per page, so /play/ already resolves to
# /play/index.html. Nothing here needs a rewrite rule.

# Headers a site with accounts on it should send. Without X-Frame-Options any
# page could load /account inside an invisible frame and steer a click onto
# "Delete account". Geolocation stays allowed for "Sort by distance" on the
# trails page; nothing here uses the camera or the microphone.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# The app, downloaded from the site (tools/publish-apk.sh puts it there). The
# Android type makes a phone offer to install it; no-cache so a new build at
# the same address is never served stale.
[[headers]]
  for = "/meARc.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"meARc.apk\""
    Cache-Control = "public, max-age=0, must-revalidate"

# The APK was called ARTrail.apk before the app became meARc. Links already
# shared (QR codes, messages) keep working.
[[redirects]]
  from = "/ARTrail.apk"
  to = "/meARc.apk"
  status = 301
  force = true
